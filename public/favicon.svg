<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- Kodamas favicon: a kodama wisp, a round orb of light, on the navy
	     canvas. The orb breathes and the spark twinkles where the browser
	     animates SVG favicons (Firefox); elsewhere it shows still. Colours
	     are the brand tokens: midnight navy #1a2231, aqua glow #5cefec. -->
	<defs>
		<radialGradient id="halo">
			<stop offset="0" stop-color="#5cefec" stop-opacity="0.4" />
			<stop offset="0.55" stop-color="#5cefec" stop-opacity="0.12" />
			<stop offset="1" stop-color="#5cefec" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="orb">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="0.36" stop-color="#ffffff" />
			<stop offset="0.74" stop-color="#5cefec" />
			<stop offset="1" stop-color="#5cefec" stop-opacity="0.5" />
		</radialGradient>
		<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="0.35" />
		</filter>
	</defs>

	<rect width="32" height="32" rx="7" fill="#1a2231" />

	<!-- Halo, breathing -->
	<circle cx="15.5" cy="17" r="14" fill="url(#halo)">
		<animate attributeName="opacity" values="0.7;1;0.75;1;0.7" dur="3.4s" repeatCount="indefinite" />
	</circle>

	<!-- Orb: grows and shrinks a little, its light flickering -->
	<circle cx="15.5" cy="17" r="9" fill="url(#orb)" filter="url(#soft)">
		<animate
			attributeName="r"
			values="9;9.8;8.6;9.4;9"
			dur="2.2s"
			repeatCount="indefinite"
			calcMode="spline"
			keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
		/>
		<animate attributeName="opacity" values="0.9;1;0.8;1;0.9" dur="1.7s" repeatCount="indefinite" />
	</circle>

	<!-- Spark, twinkling -->
	<circle cx="26.5" cy="6.5" r="1.3" fill="#ffffff">
		<animate attributeName="opacity" values="0.8;0.2;1;0.8" keyTimes="0;0.4;0.7;1" dur="2.6s" repeatCount="indefinite" />
	</circle>
</svg>
