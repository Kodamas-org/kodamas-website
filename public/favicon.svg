<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- Kodamas favicon: a kodama wisp on the navy canvas. The flame
	     flickers and the spark twinkles where the browser animates SVG
	     favicons (Firefox); elsewhere it shows still. Colours are the
	     brand tokens: midnight navy #1a2231, aqua glow #5cefec. -->
	<defs>
		<radialGradient id="halo" cx="50%" cy="58%" r="50%">
			<stop offset="0" stop-color="#5cefec" stop-opacity="0.35" />
			<stop offset="0.55" stop-color="#5cefec" stop-opacity="0.12" />
			<stop offset="1" stop-color="#5cefec" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="flame" cx="50%" cy="62%" r="50%">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="0.32" stop-color="#ffffff" />
			<stop offset="0.62" stop-color="#5cefec" />
			<stop offset="1" stop-color="#5cefec" stop-opacity="0.55" />
		</radialGradient>
		<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="0.35" />
		</filter>
	</defs>

	<rect width="32" height="32" rx="7" fill="#1a2231" />

	<!-- Halo, breathing -->
	<ellipse cx="16" cy="18" rx="12" ry="13" fill="url(#halo)">
		<animate attributeName="opacity" values="0.7;1;0.75;1;0.7" dur="3.4s" repeatCount="indefinite" />
	</ellipse>

	<!-- Flame: a tall drop of light whose tip sways and stretches -->
	<g filter="url(#soft)">
		<path fill="url(#flame)" d="M16.0 2.7 C19.9 8.2 23.8 13.7 23.8 19.8 C23.8 24.8 20.4 28.3 16.0 28.3 C11.6 28.3 8.2 24.8 8.2 19.8 C8.2 13.7 12.1 8.2 16.0 2.7 Z">
			<animate
				attributeName="d"
				dur="2.2s"
				repeatCount="indefinite"
				calcMode="spline"
				keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
				values="
					M16.0 2.7 C19.9 8.2 23.8 13.7 23.8 19.8 C23.8 24.8 20.4 28.3 16.0 28.3 C11.6 28.3 8.2 24.8 8.2 19.8 C8.2 13.7 12.1 8.2 16.0 2.7 Z;
					M17.9 1.5 C21.2 7.6 24.5 13.7 24.1 19.9 C23.8 24.9 20.4 28.4 16.0 28.4 C11.6 28.4 7.9 24.9 8.1 19.9 C8.3 13.1 13.4 7.6 17.9 1.5 Z;
					M14.2 3.3 C18.6 8.8 23.5 14.0 23.5 19.6 C23.5 24.6 20.3 28.2 16.0 28.2 C11.7 28.2 8.5 24.6 8.5 19.6 C8.5 14.3 11.3 9.2 14.2 3.3 Z;
					M16.0 2.7 C19.9 8.2 23.8 13.7 23.8 19.8 C23.8 24.8 20.4 28.3 16.0 28.3 C11.6 28.3 8.2 24.8 8.2 19.8 C8.2 13.7 12.1 8.2 16.0 2.7 Z"
			/>
			<animate attributeName="opacity" values="0.9;1;0.8;1;0.9" dur="1.7s" repeatCount="indefinite" />
		</path>
	</g>

	<!-- Spark, twinkling -->
	<circle cx="26" cy="7" r="1.3" fill="#ffffff">
		<animate attributeName="opacity" values="0.8;0.2;1;0.8" keyTimes="0;0.4;0.7;1" dur="2.6s" repeatCount="indefinite" />
	</circle>
</svg>
